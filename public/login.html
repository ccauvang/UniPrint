<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - UniPrint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/auth.css">
</head>

<body>
    <header class="top">
        <a class="logo" href="/">Uni Print</a>
        <div class="top-actions">
            <button type="button" class="icon-btn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" />
                </svg>
            </button>
        </div>
    </header>

    <main class="hero">
        <h1>welcome back</h1>
        <p class="lead">Login to print your files and order souvenirs.</p>

        <form class="card" id="loginForm" data-auth="login">
            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" placeholder="name@email.com"
                    autocomplete="email" required>
            </div>

            <div class="field">
                <label class="label" for="password">Password</label>
                <div class="pw">
                    <input class="input" id="password" name="password" type="password" placeholder="Password"
                        autocomplete="current-password" required>
                    <button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password"
                        aria-pressed="false">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                            <circle cx="12" cy="12" r="3" />
                            <path class="slash" d="M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <p class="msg" id="formMsg" role="alert" hidden></p>

            <button type="submit" class="btn">login</button>

            <p class="switch">No account yet? <a href="/register.html">Create one</a></p>
        </form>
    </main>

    <footer class="foot">© 2026 UniPrint.</footer>

    <script src="/src/scripts/auth.js"></script>
</body>

</html>
