<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - UniPrint</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
        <a href="/" class="logo">Uni Print</a>
    </header>
    <main class="wrap">
        <section id="authSection">
            <form id="loginForm">
                <h2>Login</h2>
                <input name="email" type="email" placeholder="Email" required>
                <input name="password" type="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p id="authMsg" class="msg"></p>
                <a href="register.html">No account? Register</a>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
