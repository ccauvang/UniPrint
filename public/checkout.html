<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - UniPrint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/print.css">
    <link rel="stylesheet" href="/src/styles/checkout.css">
</head>

<body>
    <header class="top">
        <a class="back" href="/cart.html" aria-label="Back to cart">
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 1.5L2 9l7 7.5" />
            </svg>
        </a>
        <h1>Checkout</h1>
    </header>

    <main class="wrap">
        <div class="group" role="radiogroup" aria-labelledby="lblDelivery">
            <div class="label" id="lblDelivery">Delivery</div>
            <div class="choices">
                <label class="choice">
                    <input type="radio" name="delivery" value="pickup" checked>
                    <span class="dot"></span>
                    <span class="choice-body">
                        <span class="choice-title">Pick up at shop</span>
                        <span class="choice-note">Ready in about 45 min</span>
                    </span>
                    <span class="choice-price" data-fee="pickup"></span>
                </label>
                <label class="choice">
                    <input type="radio" name="delivery" value="campus">
                    <span class="dot"></span>
                    <span class="choice-body">
                        <span class="choice-title">Campus delivery</span>
                        <span class="choice-note">Inside the university</span>
                    </span>
                    <span class="choice-price" data-fee="campus"></span>
                </label>
            </div>
        </div>

        <div class="group" id="roomBox" hidden>
            <label class="label" for="room">Building and room</label>
            <input class="input" id="room" name="room" type="text" maxlength="100" placeholder="Block 7 - 7.3.18"
                autocomplete="off">
        </div>

        <div class="group" role="radiogroup" aria-labelledby="lblPayment">
            <div class="label" id="lblPayment">Payment</div>
            <div class="choices">
                <label class="choice">
                    <input type="radio" name="payment" value="qr" checked>
                    <span class="dot"></span>
                    <span class="choice-body">
                        <span class="choice-title">QR code</span>
                        <span class="choice-note">Scan with your banking app</span>
                    </span>
                </label>
                <label class="choice">
                    <input type="radio" name="payment" value="cash">
                    <span class="dot"></span>
                    <span class="choice-body">
                        <span class="choice-title">Cash</span>
                        <span class="choice-note" id="cashNote">Pay when you pick up</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="group">
            <label class="label" for="code">Voucher</label>
            <form class="code-row" id="voucherForm" novalidate>
                <input class="input" id="code" name="code" type="text" maxlength="30" placeholder="Voucher code"
                    autocomplete="off" autocapitalize="characters">
                <button type="submit" class="apply" id="applyBtn">Apply</button>
            </form>
            <div class="voucher" id="voucher" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 5L5 19" />
                    <circle cx="7" cy="7" r="2" />
                    <circle cx="17" cy="17" r="2" />
                </svg>
                <span class="voucher-text" id="voucherText"></span>
                <button type="button" class="voucher-x" id="removeVoucher" aria-label="Remove voucher">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </button>
            </div>
        </div>

        <dl class="sum">
            <div class="sum-row">
                <dt>Subtotal</dt>
                <dd id="sSub">-</dd>
            </div>
            <div class="sum-row" id="sVoucherRow" hidden>
                <dt id="sVoucherLabel">Voucher</dt>
                <dd class="disc" id="sVoucher"></dd>
            </div>
            <div class="sum-row">
                <dt id="sShipLabel">Pick up at shop</dt>
                <dd id="sShip">-</dd>
            </div>
        </dl>

        <p class="msg" id="msg" role="status" hidden></p>
    </main>

    <footer class="total">
        <div class="total-in">
            <div>
                <div class="total-label">Total</div>
                <div class="total-value" id="total" aria-live="polite">-</div>
            </div>
            <button type="button" class="add" id="placeBtn" disabled>Place order</button>
        </div>
    </footer>

    <script src="/src/scripts/checkout.js"></script>
</body>

</html>
