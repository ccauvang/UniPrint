<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniPrint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>UniPrint</h1>
        <div id="userBox"></div>
    </header>

    <main>
        <section id="authSection">
            <div class="two-col">
                <form id="loginForm">
                    <h2>Login</h2>
                    <input name="email" type="email" placeholder="Email" required>
                    <input name="password" type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>

                <form id="registerForm">
                    <h2>Register</h2>
                    <input name="fullName" placeholder="Full name" required>
                    <input name="email" type="email" placeholder="Email" required>
                    <input name="password" type="password" placeholder="Password (min 6)" required>
                    <input name="studentOrStaffCode" placeholder="Student / staff code">
                    <button type="submit">Register</button>
                </form>
            </div>
            <p id="authMsg" class="msg"></p>
        </section>

        <section id="adminSection" hidden>
            <form id="productForm">
                <h2>Add product (staff only)</h2>
                <input name="name" placeholder="Product name" required>
                <input name="basePrice" type="number" min="0" placeholder="Base price (VND)" required>
                <input name="tags" placeholder="Tags, comma separated">
                <label><input name="isPrintable" type="checkbox"> Printable (customer can add own design)</label>
                <textarea name="variants" rows="3"
                    placeholder="Variants, one per line: SKU,size,color,stock&#10;POLO-WHITE-L,L,White,20"></textarea>
                <button type="submit">Add product</button>
            </form>
        </section>

        <section>
            <h2>Products</h2>
            <div id="productList" class="grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
