<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - UniPrint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/auth.css">
</head>

<body>
    <header class="top">
        <a class="logo" href="/">Uni Print</a>
        <div class="top-actions">
            <button type="button" class="icon-btn" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18" />
                </svg>
            </button>
        </div>
    </header>

    <main class="hero">
        <h1>create account</h1>
        <p class="lead">One account for printing and souvenirs.</p>

        <form class="card card--wide" id="registerForm" data-auth="register">
            <div class="field">
                <label class="label" for="fullName">Full name</label>
                <input class="input" id="fullName" name="fullName" type="text" placeholder="Full name"
                    autocomplete="name" required>
            </div>

            <div class="field">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" placeholder="name@email.com"
                    autocomplete="email" required>
            </div>

            <div class="row">
                <div class="field">
                    <label class="label" for="studentOrStaffCode">Student / staff code <span>(optional)</span></label>
                    <input class="input" id="studentOrStaffCode" name="studentOrStaffCode" type="text"
                        placeholder="Student / staff code">
                </div>
                <div class="field">
                    <label class="label" for="classCode">Class code <span>(optional)</span></label>
                    <input class="input" id="classCode" name="classCode" type="text" placeholder="Class code">
                </div>
            </div>

            <div class="field">
                <label class="label" for="phoneNumber">Phone number <span>(optional)</span></label>
                <input class="input" id="phoneNumber" name="phoneNumber" type="tel" placeholder="Phone number"
                    autocomplete="tel">
            </div>

            <div class="row">
                <div class="field">
                    <label class="label" for="password">Password</label>
                    <div class="pw">
                        <input class="input" id="password" name="password" type="password" placeholder="Password"
                            autocomplete="new-password" minlength="6" aria-describedby="pwHint" required>
                        <button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password"
                            aria-pressed="false">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                                <circle cx="12" cy="12" r="3" />
                                <path class="slash" d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                    <p class="hint" id="pwHint">Min 6 characters</p>
                </div>
                <div class="field">
                    <label class="label" for="confirmPassword">Confirm password</label>
                    <input class="input" id="confirmPassword" name="confirmPassword" type="password"
                        placeholder="Confirm password" autocomplete="new-password" minlength="6" required>
                </div>
            </div>

            <p class="msg" id="formMsg" role="alert" hidden></p>

            <button type="submit" class="btn">create account</button>

            <p class="switch">Have an account? <a href="/login.html">Login</a></p>
        </form>
    </main>

    <footer class="foot">© 2026 UniPrint.</footer>

    <script src="/src/scripts/auth.js"></script>
</body>

</html>
